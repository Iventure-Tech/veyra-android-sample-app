plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Credentials and onboarding identifiers come from veyra.properties (git-ignored).
// Copy veyra.properties.example to veyra.properties and fill in your values.
def veyraProps = new Properties()
def veyraPropsFile = rootProject.file('veyra.properties')
if (veyraPropsFile.exists()) {
    veyraPropsFile.withInputStream { veyraProps.load(it) }
}
def veyraProp = { String key ->
    def value = veyraProps.getProperty(key)?.trim()
    if (!value || value.startsWith('your-')) {
        logger.warn("veyra.properties: '${key}' is not set — copy veyra.properties.example " +
                "to veyra.properties and fill in the values from your Veyra onboarding.")
        return ''
    }
    return value
}
// The connection values (client id/secret, bank backend, bank session) are optional at build
// time: which ones are needed depends on the provider AppProvider.provider() returns, so an
// unset value reaches BuildConfig as "" (see provider/AppProvider.kt).
def connectionValue = { String key ->
    def v = veyraProps.getProperty(key)?.trim() ?: ''
    if (v.startsWith('your-')) v = ''
    '"' + v.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'co.veyra.bank'
    compileSdk 34

    defaultConfig {
        applicationId "co.veyra.bank"
        // softpos-sdk requires 28 (wallet-only integrations can go down to 24)
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Injected as string resources so the rest of the app reads them like any other
        // config value (see VeyraBank.kt).
        resValue "string", "payment_app_provider_id", veyraProp('veyra.paymentAppProviderId')
        resValue "string", "token_requestor_id", veyraProp('veyra.tokenRequestorId')

        // How both SDKs reach Veyra — see provider/AppProvider.kt.
        buildConfigField 'String', 'VEYRA_CLIENT_ID', connectionValue('veyra.clientId')
        buildConfigField 'String', 'VEYRA_CLIENT_SECRET', connectionValue('veyra.clientSecret')
        buildConfigField 'String', 'BANK_BACKEND_BASE_URL', connectionValue('veyra.bankBackendBaseUrl')
        // Your bank's own OAuth client at its authorization server (HTTP Basic on the login and the
        // assertion provider's token exchange). Never passed to the SDK.
        buildConfigField 'String', 'BANK_CLIENT_ID', connectionValue('veyra.bankClientId')
        buildConfigField 'String', 'BANK_CLIENT_SECRET', connectionValue('veyra.bankClientSecret')
        // The demo user's bank login (password grant at {bankBackendBaseUrl}/oauth2/token): the
        // session both the assertion and the proxy provider use. A real app takes them from its
        // login screen.
        buildConfigField 'String', 'BANK_USERNAME', connectionValue('veyra.username')
        buildConfigField 'String', 'BANK_PASSWORD', connectionValue('veyra.password')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Unsigned release APKs cannot be installed; the debug keystore here is for
            // local evaluation only — use your own signing config for anything real.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Single entry point: pulls softpos-sdk, wallet-sdk and the shared core artifacts
    // transitively from the Veyra Maven repository (declared in settings.gradle).
    implementation 'co.veyra:veyra-sdk:2.0.0'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // QR code (receipts: softpos flow renders, wallet flow scans)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'

    // HTTP client for the two calls this app makes to its own bank backend (connection/)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON (activation method persistence in the wallet flow)
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
